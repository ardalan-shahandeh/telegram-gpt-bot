    </g>
    <g transform="translate(930 304) rotate(4)">
      <rect width="213" height="69" rx="22" fill="#22d3ee"/>
      <path d="M40 66 L22 88 L26 58" fill="#22d3ee"/>
      <text x="107" y="43" text-anchor="middle" font-size="21" font-weight="700" fill="#083344">Let’s chat! ✨</text>
    </g>
