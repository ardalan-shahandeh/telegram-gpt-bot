<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Telegram GPT Bot</title>
  <desc id="desc">A playful robot chatting through Telegram with colorful message bubbles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="robot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#67e8f9" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#dots)"/>
  <circle cx="1060" cy="65" r="120" fill="#22d3ee" opacity="0.08"/>
  <circle cx="110" cy="390" r="180" fill="#818cf8" opacity="0.10"/>

  <g transform="translate(745 56)" filter="url(#shadow)">
    <path d="M55 82 C8 78 -9 117 14 149 C-6 188 17 226 55 223" fill="#38bdf8" opacity="0.95"/>
    <path d="M279 96 C331 91 348 132 321 163 C344 200 317 235 279 229" fill="#818cf8" opacity="0.95"/>
    <rect x="42" y="55" width="250" height="210" rx="62" fill="url(#robot)" stroke="#e0f2fe" stroke-width="8"/>
    <rect x="78" y="101" width="178" height="98" rx="35" fill="#0f172a"/>
    <circle cx="130" cy="149" r="16" fill="#22d3ee"/>
    <circle cx="205" cy="149" r="16" fill="#a5f3fc"/>
    <path d="M133 230 Q167 252 202 230" fill="none" stroke="#0e7490" stroke-width="9" stroke-linecap="round"/>
    <path d="M167 53 V21" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
    <circle cx="167" cy="14" r="13" fill="#fb7185"/>
    <rect x="91" y="275" width="153" height="32" rx="16" fill="#22d3ee"/>
    <path d="M167 307 V340 M116 340 H218" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(58 56)">
      <rect width="192" height="42" rx="21" fill="#0ea5e9"/>
      <text x="96" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">OPEN SOURCE • FUN</text>
    </g>
    <text x="58" y="176" font-size="66" font-weight="800" fill="#f8fafc" letter-spacing="-2">Telegram GPT Bot</text>
    <text x="61" y="222" font-size="25" fill="#bae6fd">Your tiny AI friend, living inside Telegram.</text>

    <g transform="translate(59 269)">
      <rect width="172" height="52" rx="26" fill="#f8fafc" opacity="0.12" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text x="86" y="33" text-anchor="middle" font-size="19" font-weight="700" fill="#e0f2fe">TypeScript</text>
    </g>
    <g transform="translate(245 269)">
      <rect width="155" height="52" rx="26" fill="#f8fafc" opacity="0.12" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text x="78" y="33" text-anchor="middle" font-size="19" font-weight="700" fill="#e0f2fe">Telegraf</text>
    </g>
    <g transform="translate(414 269)">
      <rect width="184" height="52" rx="26" fill="#f8fafc" opacity="0.12" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text x="92" y="33" text-anchor="middle" font-size="19" font-weight="700" fill="#e0f2fe">OpenRouter</text>
    </g>

